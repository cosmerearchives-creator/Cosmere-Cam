name: Windows build, test and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      COSMERE_TEST_MODE: '1'
      COSMERE_ALIGNMENT_TEST_MODEL: ${{ github.workspace }}/build/alignment-test/vosk-model-small-en-us-0.15
      COSMERE_REAPLUGS_TEST_DIR: ${{ github.workspace }}/build/reaplugs-test/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            dynamic_teleprompter/requirements.txt
            tools/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r tools/requirements-build.txt
      - name: Syntax and unit tests
        run: |
          python -m compileall -q dynamic_teleprompter tools tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Verify text editing, processing, timing review and canvas responsiveness
        run: python tools/verify_development.py
      - name: Build real Windows application and installer
        run: |
          python tools/build_windows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip freeze > dist/requirements-resolved.txt
      - name: Verify official x64 ReaPlugs audio, native editors and saved profiles
        run: python tools/verify_reaplugs.py --editors
      - name: Capture suite screens and themed dialogs
        run: python tools/capture_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Suite-UI-previews
          path: build/ui-preview/*.png
      - name: Windows installer, upgrade, rollback, Qt and FFmpeg tests
        run: python tools/windows_e2e.py
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'dynamic_teleprompter'); from version import VERSION; print(VERSION)"
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Cosmere-Video-Recording-Suite-Windows
          path: |
            dist/Cosmere-Video-Recording-Suite-Setup.exe
            dist/Cosmere-Cam-Windows-x64.zip
            dist/update-manifest.json
            dist/*-source.zip
            dist/release-notes.md
            dist/requirements-resolved.txt
            dist/windows-verification.json
            dist/reaplugs-verification.json
            dist/development-verification.json
          retention-days: 30
      - name: Publish verified version as draft
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (($existing | ConvertFrom-Json).isDraft) {
              gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
              $tagExists = $LASTEXITCODE -eq 0
              gh release delete $tag --yes
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              if ($tagExists) {
                gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" --method DELETE
                if ($LASTEXITCODE) { exit $LASTEXITCODE }
              }
            } else {
              "created=false" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          gh release create $tag dist/Cosmere-Video-Recording-Suite-Setup.exe dist/Cosmere-Cam-Windows-x64.zip dist/update-manifest.json dist/*-source.zip dist/requirements-resolved.txt dist/windows-verification.json dist/reaplugs-verification.json dist/development-verification.json --target "$env:GITHUB_SHA" --title "Cosmere Video Recording Suite $tag" --notes-file dist/release-notes.md --draft --prerelease
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "created=true" >> $env:GITHUB_OUTPUT
      - name: Verify uploaded asset hashes before publishing
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_release.py
      - name: Make release available to users
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ steps.version.outputs.tag }}' --draft=false
      - name: Verify shipping updater against published release on Windows
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/windows_e2e.py --published --output dist/published-verification.json
      - name: Attach published end-to-end results
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ steps.version.outputs.tag }}' dist/published-verification.json --clobber
      - name: Withdraw new release if verification fails
        if: failure() && steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ steps.version.outputs.tag }}' --draft=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-verification-logs
          path: |
            dist/*verification.json
            build/**/*.txt
          if-no-files-found: ignore

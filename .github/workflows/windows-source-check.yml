name: Windows source check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python source
        shell: pwsh
        run: |
          if (-not (Test-Path "dynamic_teleprompter/app.py")) {
            throw "Baseline source missing: import the alpha16.1 code before building."
          }
          python -m compileall -q dynamic_teleprompter
      - name: Install Qt for regression tests
        run: python -m pip install "PySide6>=6.6,<7"
      - name: Test movement and background rendering
        working-directory: dynamic_teleprompter
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Package distributable source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/dynamic_teleprompter | Out-Null
          robocopy dynamic_teleprompter staging/dynamic_teleprompter /E /XD __pycache__ .venv build dist /XF *.pyc *.dll *.pdb *.moc3 *.mp4 *.mkv *.wav *.model3.json *.motion3.json *.physics3.json *.exp3.json | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          Compress-Archive -Path staging/dynamic_teleprompter -DestinationPath Cosmere-Cam-source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Cosmere-Cam-Windows-source
          path: Cosmere-Cam-source.zip
          retention-days: 30
